<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>API Monitor // v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b14;--surface:rgba(10,20,40,0.85);--border:rgba(0,240,255,0.15);--cyan:#00f0ff;--blue:#6c5ce7;--magenta:#ff00aa;--green:#00ff88;--red:#ff3366;--yellow:#ffd700;--text:#c8d6e5;--dim:#5c7a9a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#gridBg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(0,240,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.03) 1px,transparent 1px);background-size:40px 40px;animation:gridMove 20s linear infinite}
@keyframes gridMove{0%{transform:perspective(500px) rotateX(60deg) translateY(0)}100%{transform:perspective(500px) rotateX(60deg) translateY(40px)}}
#scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px)}
.glow-orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:0.3;animation:orbPulse 8s ease-in-out infinite}
.glow-orb.a{top:-200px;left:10%;width:400px;height:400px;background:var(--cyan);animation-delay:0s}
.glow-orb.b{bottom:-200px;right:10%;width:350px;height:350px;background:var(--magenta);animation-delay:4s}
@keyframes orbPulse{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:0.4;transform:scale(1.2)}}

.header{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(6,11,20,0.9);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.header h1{font-family:'Orbitron',sans-serif;font-size:1.3rem;color:var(--cyan);text-shadow:0 0 20px rgba(0,240,255,0.3);letter-spacing:2px}
.header-right{display:flex;gap:10px;align-items:center}
#userInfo{color:var(--dim);font-size:.85rem;font-family:'Share Tech Mono',monospace}
.btn{padding:8px 18px;border-radius:2px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s;letter-spacing:1px;text-transform:uppercase}
.btn-primary{background:transparent;border:1px solid var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,0.15)}
.btn-primary:hover{background:rgba(0,240,255,0.1);box-shadow:0 0 20px rgba(0,240,255,0.3)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--dim)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);font-size:.7rem;padding:3px 8px}
.btn-danger:hover{background:rgba(255,51,102,0.1)}
.btn-sm{padding:4px 10px;font-size:.7rem}

.container{position:relative;z-index:10;max-width:1100px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:20px;text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.5}
.stat-card .num{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:700;color:var(--cyan);text-shadow:0 0 15px rgba(0,240,255,0.4)}
.stat-card .num.warn{color:var(--yellow);text-shadow:0 0 15px rgba(255,215,0,0.4)}
.stat-card .num.danger{color:var(--red);text-shadow:0 0 15px rgba(255,51,102,0.4)}
.stat-card .lbl{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-top:4px;font-family:'Share Tech Mono',monospace}

.card{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px);position:relative}
.card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,240,255,0.3),transparent)}
.card h2{font-family:'Orbitron',sans-serif;font-size:.95rem;color:var(--cyan);margin-bottom:14px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.card h2 span{font-size:.7rem;color:var(--dim);font-family:'Share Tech Mono',monospace;letter-spacing:0}

.add-form{display:flex;gap:8px}
.add-form input{flex:1;padding:10px 14px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:.85rem;outline:none;transition:border-color .2s}
.add-form input:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,0.1)}
.add-form input::placeholder{color:var(--dim)}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);color:var(--dim);font-size:.7rem;text-transform:uppercase;letter-spacing:1px;font-family:'Share Tech Mono',monospace}
td{padding:10px 12px;border-bottom:1px solid rgba(0,240,255,0.05);font-family:'Share Tech Mono',monospace;font-size:.8rem}
tr:hover td{background:rgba(0,240,255,0.03)}

.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;animation:pulse 2s ease-in-out infinite}
.status-dot.up{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-dot.down{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
.status-dot.warn{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--cyan);border-radius:2px;padding:30px;width:100%;max-width:400px;box-shadow:0 0 40px rgba(0,240,255,0.1)}
.modal h2{font-family:'Orbitron',sans-serif;color:var(--cyan);margin-bottom:20px;letter-spacing:2px;font-size:1.2rem}
.modal input{width:100%;padding:12px;margin-bottom:12px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:.85rem;outline:none}
.modal input:focus{border-color:var(--cyan)}
.modal .btn{width:100%;margin-top:4px}
#loginError{color:var(--red);font-size:.8rem;margin-top:8px;display:none;font-family:'Share Tech Mono',monospace}

#detailCard{display:none}

select{background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:2px;color:var(--text);padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:.8rem;outline:none}

@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="gridBg"></div>
<div id="scanlines"></div>
<div class="glow-orb a"></div><div class="glow-orb b"></div>

<div class="header">
<h1>// API_MONITOR</h1>
<div class="header-right">
<span id="userInfo">SYS::OFFLINE</span>
<button class="btn btn-ghost btn-sm" onclick="showLogin()" id="loginBtn">LOGIN</button>
<button class="btn btn-ghost btn-sm" onclick="showPwChange()" id="pwdBtn" style="display:none">Change Password</button>
<button class="btn btn-ghost btn-sm" onclick="logout()" id="logoutBtn" style="display:none">EXIT</button>
</div>
</div>

<div class="modal-overlay" id="authBox">
<div class="modal" id="loginPanel">
<h2>// LOGIN</h2>
<input id="loginEmail" placeholder="Email" type="email">
<input id="loginPass" placeholder="Password" type="password" onkeydown="if(event.key==='Enter')doLogin()">
<div id="loginError">ACCESS DENIED</div>
<button class="btn btn-primary" onclick="doLogin()">Sign In</button>
<button class="btn btn-ghost" style="margin-top:6px" onclick="hideLogin()">Cancel</button>
</div>
<div class="modal" id="pwdPanel" style="display:none">
<h2>// CHANGE PASSWORD</h2>
<input id="oldPass" placeholder="Current Password" type="password">
<input id="newPass" placeholder="New Password" type="password">
<input id="newPass2" placeholder="Confirm New Password" type="password">
<div id="pwdError" style="color:var(--red);font-size:.8rem;display:none;font-family:'Share Tech Mono',monospace;margin-top:4px"></div>
<div id="pwdOk" style="color:var(--green);font-size:.8rem;display:none;font-family:'Share Tech Mono',monospace;margin-top:4px"></div>
<button class="btn btn-primary" onclick="doPwChange()">Update Password</button>
<button class="btn btn-ghost" style="margin-top:6px" onclick="hidePwChange()">Cancel</button>
</div>
</div>

<div class="container">
<div class="stats">
<div class="stat-card"><div class="num" id="monCount">--</div><div class="lbl">MONITORS</div></div>
<div class="stat-card"><div class="num" id="upCount">--</div><div class="lbl">ONLINE</div></div>
<div class="stat-card"><div class="num warn" id="downCount">--</div><div class="lbl">OFFLINE</div></div>
<div class="stat-card"><div class="num" id="avgAll">--</div><div class="lbl">AVG LATENCY</div></div>
</div>

<div class="card">
<h2>// ADD_ENDPOINT</h2>
<div class="add-form">
<input id="monUrl" placeholder="https://api.target.com/health">
<input id="monName" placeholder="CALLSIGN" style="max-width:160px">
<button class="btn btn-primary" onclick="addMonitor()">DEPLOY</button>
</div>
</div>

<div class="card">
<h2>// ACTIVE_NODES <span id="planInfo"></span></h2>
<table><thead><tr><th>CALLSIGN</th><th>TARGET</th><th>STATUS</th><th>LATENCY</th><th>SSL_TTL</th><th>LAST_PING</th><th></th></tr></thead>
<tbody id="monitors"></tbody></table>
</div>

<div class="card" id="detailCard">
<h2>// TELEMETRY :: <span id="detailName"></span></h2>
<table><thead><tr><th>CODE</th><th>LATENCY</th><th>SSL</th><th>ERR</th><th>TIMESTAMP</th></tr></thead>
<tbody id="checks"></tbody></table>
</div>

<div class="card" id="adminCard" style="display:none">
<h2>// ADMIN_CONSOLE</h2>
<div class="add-form" style="margin-bottom:14px">
<input id="newUserEmail" placeholder="OPERATOR_EMAIL" type="email">
<select id="newUserPlan"><option value="free">FREE</option><option value="pro">PRO</option><option value="unlimited">UNLIMITED</option></select>
<button class="btn btn-primary btn-sm" onclick="adminCreateUser()">CREATE</button>
</div>
<table><thead><tr><th>EMAIL</th><th>TIER</th><th>ROOT</th><th>ACTIVE</th><th>LAST_LOGIN</th><th></th></tr></thead>
<tbody id="adminUsers"></tbody></table>
</div>
</div>

<script>
var TOKEN=localStorage.getItem('apitoken')||'';
function H(){return TOKEN?{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}

async function loadStats(){
if(!TOKEN){document.getElementById('monCount').textContent='--';return}
var r=await fetch('/api/auth/me',{headers:H()});
if(r.status===401){TOKEN='';localStorage.removeItem('apitoken');updateUI();return}
var me=await r.json();
document.getElementById('userInfo').textContent='SYS::'+me.email.split('@')[0].toUpperCase()+' ['+me.plan.toUpperCase()+']';
document.getElementById('planInfo').textContent='SLOTS: '+me.monitors_used+'/'+me.monitors_limit;
document.getElementById('logoutBtn').style.display='inline-block';
document.getElementById('pwdBtn').style.display='inline-block';
document.getElementById('loginBtn').style.display='none';
if(me.is_admin) document.getElementById('adminCard').style.display='block';
var sr=await fetch('/api/stats',{headers:H()});
var d=await sr.json();
document.getElementById('monCount').textContent=d.length;
var up=d.filter(function(m){return m.last_status&&m.last_status<400}).length;
document.getElementById('upCount').textContent=up;
document.getElementById('downCount').textContent=d.length-up;
var avgs=d.filter(function(m){return m.avg_ms}).map(function(m){return m.avg_ms});
document.getElementById('avgAll').textContent=avgs.length?Math.round(avgs.reduce(function(a,b){return a+b})/avgs.length)+'ms':'--';
document.getElementById('monitors').innerHTML=d.map(function(m){
var dot=m.last_status&&m.last_status<400?'<span class="status-dot up"></span>UP':'<span class="status-dot down"></span>DOWN';
var ssl='--';
if(m.ssl_days!=null) ssl=m.ssl_days<0?'<span class="status-dot down"></span>EXP':m.ssl_days<14?'<span class="status-dot warn"></span>'+m.ssl_days+'d':m.ssl_days+'d';
return '<tr onclick="showDetail('+m.id+',\''+(m.name||m.url).replace(/'/g,'\\\'')+'\')" style="cursor:pointer"><td>'+(m.name||'---')+'</td><td>'+m.url.substring(0,45)+'</td><td>'+dot+'</td><td>'+(m.avg_ms||'--')+'ms</td><td>'+ssl+'</td><td>'+(m.last_checked||'').substring(11,19)+'</td><td><button class="btn btn-danger" onclick="event.stopPropagation();delMon('+m.id+')">DEL</button></td></tr>';
}).join('');
if(me.is_admin) loadAdmin();
}

async function loadAdmin(){
var r=await fetch('/api/admin/users',{headers:H()});
var users=await r.json();
document.getElementById('adminUsers').innerHTML=users.map(function(u){
return '<tr><td>'+u.email+'</td><td>'+u.plan.toUpperCase()+'</td><td>'+(u.is_admin?'YES':'NO')+'</td><td>'+(u.is_active?'ONLINE':'OFFLINE')+'</td><td>'+(u.last_login||'--').substring(0,16)+'</td><td><button class="btn btn-danger" onclick="adminDeleteUser(\''+u.id+'\')">DEL</button></td></tr>';
}).join('');
}

async function showDetail(id,name){document.getElementById('detailCard').style.display='block';document.getElementById('detailName').textContent=name;window._mid=id;loadChecks();}
async function loadChecks(){var r=await fetch('/api/monitors/'+window._mid+'/checks?limit=30',{headers:H()});var d=await r.json();
document.getElementById('checks').innerHTML=d.map(function(c){
return '<tr><td>'+c.status+'</td><td>'+(c.ms||'--')+'ms</td><td>'+(c.ssl_days!=null?c.ssl_days+'d':'--')+'</td><td style="color:var(--red);font-size:.7rem">'+(c.error||'').substring(0,50)+'</td><td>'+(c.at||'').substring(11,19)+'</td></tr>';
}).join('');}
async function addMonitor(){var url=document.getElementById('monUrl').value;if(!url.startsWith('http'))url='https://'+url;var name=document.getElementById('monName').value;
await fetch('/api/monitors',{method:'POST',headers:H(),body:JSON.stringify({url:url,name:name})});
document.getElementById('monUrl').value='';document.getElementById('monName').value='';loadStats();}
async function delMon(id){if(confirm('CONFIRM DELETE?')){await fetch('/api/monitors/'+id,{method:'DELETE',headers:H()});loadStats();}}
function showLogin(){document.getElementById('loginPanel').style.display='block';document.getElementById('pwdPanel').style.display='none';document.getElementById('authBox').style.display='flex';}
function hideLogin(){document.getElementById('authBox').style.display='none';}
function showPwChange(){document.getElementById('pwdPanel').style.display='block';document.getElementById('loginPanel').style.display='none';document.getElementById('authBox').style.display='flex';}
function hidePwChange(){document.getElementById('authBox').style.display='none';document.getElementById('pwdError').style.display='none';document.getElementById('pwdOk').style.display='none';}
async function doPwChange(){
var op=document.getElementById('oldPass').value;var np=document.getElementById('newPass').value;var np2=document.getElementById('newPass2').value;
if(np!==np2){document.getElementById('pwdError').style.display='block';document.getElementById('pwdError').textContent='PASSPHRASES DO NOT MATCH';return}
var r=await fetch('/api/auth/password',{method:'PUT',headers:H(),body:JSON.stringify({old_password:op,new_password:np})});
if(r.ok){document.getElementById('pwdOk').style.display='block';document.getElementById('pwdOk').textContent='PASSPHRASE UPDATED';document.getElementById('pwdError').style.display='none';setTimeout(hidePwChange,1500)}
else{var d=await r.json();document.getElementById('pwdError').style.display='block';document.getElementById('pwdError').textContent=d.detail||'FAILED';document.getElementById('pwdOk').style.display='none'}}
async function doLogin(){var email=document.getElementById('loginEmail').value;var pw=document.getElementById('loginPass').value;
var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})});
var d=await r.json();
if(r.ok){TOKEN=d.token;localStorage.setItem('apitoken',TOKEN);hideLogin();updateUI();}
else{document.getElementById('loginError').style.display='block';document.getElementById('loginError').textContent=d.detail||'ACCESS DENIED';}}
function logout(){TOKEN='';localStorage.removeItem('apitoken');updateUI();}
async function adminCreateUser(){var email=document.getElementById('newUserEmail').value;var plan=document.getElementById('newUserPlan').value;
var r=await fetch('/api/admin/users',{method:'POST',headers:H(),body:JSON.stringify({email:email,plan:plan})});var d=await r.json();
if(d.temp_password) alert('CREATED! PASSKEY: '+d.temp_password);else alert(JSON.stringify(d));loadAdmin();}
async function adminDeleteUser(id){if(confirm('CONFIRM DELETE?')){await fetch('/api/admin/users/'+id,{method:'DELETE',headers:H()});loadAdmin();}}
function updateUI(){if(TOKEN)loadStats();else{
document.getElementById('monCount').textContent='--';document.getElementById('logoutBtn').style.display='none';
document.getElementById('pwdBtn').style.display='none';
document.getElementById('loginBtn').style.display='inline-block';document.getElementById('adminCard').style.display='none';
document.getElementById('monitors').innerHTML='';document.getElementById('userInfo').textContent='SYS::OFFLINE';}}
setInterval(function(){if(TOKEN)loadStats();if(window._mid)loadChecks();},15000);updateUI();
</script>
</body>
</html>
